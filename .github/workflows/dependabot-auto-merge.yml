name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge Dependabot PR now that CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No associated pull request found; skipping."
            exit 0
          fi

          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER was opened by $AUTHOR, not dependabot[bot]; skipping."
            exit 0
          fi

          # CI already finished successfully by the time this job runs, so try
          # a direct merge first; fall back to GitHub's auto-merge only if the
          # PR isn't immediately mergeable yet (e.g. mergeability still settling).
          if gh pr merge "$PR_NUMBER" --repo "$REPO" --squash; then
            echo "Merged PR #$PR_NUMBER"
          else
            echo "Direct merge not possible yet, enabling auto-merge as a fallback"
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto
          fi
