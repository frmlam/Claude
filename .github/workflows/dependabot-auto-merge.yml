name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Merge Dependabot PR now that CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No associated pull request found; skipping."
            exit 0
          fi

          # gh's GraphQL-backed `author.login` renders the Dependabot bot
          # account inconsistently (seen as both "dependabot[bot]" and
          # "app/dependabot"), so match on substring instead of an exact string.
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          if ! echo "$AUTHOR" | grep -qi 'dependabot'; then
            echo "PR #$PR_NUMBER was opened by $AUTHOR, not Dependabot; skipping."
            exit 0
          fi

          # CI already finished successfully by the time this job runs, but
          # GitHub can take a few seconds to recompute mergeability right
          # after a check completes, so a direct merge can fail here with
          # "the base branch policy prohibits the merge" even though the PR
          # is actually clean. Retry a few times before giving up, rather
          # than falling back to GitHub's --auto flag: once a PR's checks
          # have already completed, enabling auto-merge afterwards has no
          # further status event to react to and can stay stuck open
          # indefinitely (seen on PR #48).
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR_NUMBER" --repo "$REPO" --squash; then
              echo "Merged PR #$PR_NUMBER"
              exit 0
            fi
            echo "Merge attempt $attempt failed, retrying in 15s..."
            sleep 15
          done

          echo "::error::Could not merge PR #$PR_NUMBER after repeated attempts."
          exit 1
